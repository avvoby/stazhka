[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "stazka"
version = "0.1.0"
description = "Telegram-бот ассистент для поиска стажировок"
requires-python = ">=3.11"
dependencies = [
    # Telegram bot
    "aiogram==3.13.0",
    # Web framework
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    # Database
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    # Cache
    "redis==5.2.0",
    "aiocache==0.12.3",
    # AI
    "anthropic==0.40.0",
    # Config
    "pydantic-settings==2.6.0",
    "python-dotenv==1.0.1",
    # Utils
    "httpx==0.28.0",
    "urllib3>=2.0.0",
    "orjson==3.10.11",
    "structlog==24.4.0",
    "apscheduler>=3.10.0",
    # Google Sheets (Career Week)
    "gspread>=6.0.0",
    "google-auth>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "mypy==1.13.0",
    "ruff==0.8.0",
    "factory-boy==3.3.1",
    "faker==33.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
